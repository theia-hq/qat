# Spin up an on-demand box you reach by membership, across GitHub's NAT.
# Trigger: `gh workflow run summon.yml`, then reach it from your laptop by key:
#   swoosh ssh   me/qat              # a keyless shell (membership is the login)
#   swoosh ping  me/qat              # round-trip time to the box
#   swoosh speed me/qat              # throughput to the box
#   swoosh fetch --via me/qat <url>  # HTTP egress fetched by the box, streamed back
# The runner is scale-to-zero: nothing runs (and nothing bills) until you dispatch this.
name: summon
on:
  workflow_dispatch:
    inputs:
      expires:
        description: how long to hold the box open (a duration, e.g. 30m, 2h)
        required: false
        default: "30m"
      services:
        description: services to serve on the box (space-separated name=addr)
        required: false
        default: "ssh=sshd: fetch=fetch: ping=ping: speed=speed:"

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # hard ceiling; the Action holds for `expires`, then releases
    steps:
      - uses: theia-hq/swoosh-action@v2
        with:
          invite: ${{ secrets.THEIA_INVITE }}
          expires: ${{ inputs.expires }}
          services: ${{ inputs.services }}
